name: NeuroScale Ops CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DEMO_MODE: "true"
  PYTHON_VERSION: "3.11"

jobs:
  # ── Lint & Type Check ──────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 mypy black isort
          pip install -r requirements.txt

      - name: Black formatting check
        run: black --check --diff agents/ main.py

      - name: isort import order
        run: isort --check-only --diff agents/ main.py

      - name: Flake8 lint
        run: flake8 agents/ main.py --max-line-length=120 --ignore=E501,W503

  # ── Unit & Integration Tests ───────────────────────────────────────────────
  test:
    name: Tests (Demo Mode)
    runs-on: ubuntu-latest
    needs: lint
    env:
      DEMO_MODE: "true"
      GROQ_API_KEY: ""       # empty = rule-based fallback, no real API calls
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run test suite
        run: pytest tests/ -v --tb=short --cov=agents --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ── Full Pipeline Smoke Test ───────────────────────────────────────────────
  pipeline-smoke:
    name: Pipeline Smoke Test
    runs-on: ubuntu-latest
    needs: test
    env:
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full pipeline (all 5 scenario types)
        run: |
          python main.py --scenario oomkill --demo
          python main.py --scenario crashloop --demo
          python main.py --scenario policy_violation --demo
          python main.py --scenario cost_spike --demo
          python main.py --scenario deployment_failure --demo

  # ── Docker Build ──────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: pipeline-smoke
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: neurascale-ops:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── K8s Manifest Validation ────────────────────────────────────────────────
  k8s-validate:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate K8s manifests
        run: |
          kubeconform -strict -summary \
            k8s/base/namespace.yaml \
            k8s/base/neurascale-ops-deployment.yaml

  # ── Security Scan ─────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
