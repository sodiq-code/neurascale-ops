apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: neurascale-ops-alerts
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: prometheus
spec:
  groups:
    - name: neurascale.kubernetes
      interval: 30s
      rules:

        # ── CPU Throttling ────────────────────────────────────────────────────
        - alert: CPUThrottlingHigh
          expr: |
            sum by (namespace, pod, container, deployment) (
              rate(container_cpu_cfs_throttled_seconds_total{
                namespace=~"production|staging",
                container!=""
              }[5m])
            )
            /
            sum by (namespace, pod, container, deployment) (
              rate(container_cpu_cfs_periods_total{
                namespace=~"production|staging",
                container!=""
              }[5m])
            ) > 0.80
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "CPU throttling >80% for {{ $labels.deployment }}"
            description: "Container {{ $labels.container }} in deployment {{ $labels.deployment }} is throttled {{ $value | humanizePercentage }} of the time."
            runbook: "https://github.com/sodiq-code/neurascale-ops/blob/main/runbooks/cpu-throttling.json"

        # ── OOMKilled ─────────────────────────────────────────────────────────
        - alert: KubeContainerOOMKilled
          expr: |
            kube_pod_container_status_last_terminated_reason{
              reason="OOMKilled",
              namespace=~"production|staging"
            } == 1
          for: 0m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Container OOMKilled in {{ $labels.namespace }}"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} was OOMKilled."
            runbook: "https://github.com/sodiq-code/neurascale-ops/blob/main/runbooks/oom-killed.json"

        # ── CrashLoopBackOff ──────────────────────────────────────────────────
        - alert: KubePodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{
              namespace=~"production|staging"
            }[15m]) * 60 * 15 > 3
          for: 5m
          labels:
            severity: high
            team: platform
          annotations:
            summary: "Pod crash-looping: {{ $labels.pod }}"
            description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} has restarted {{ $value | humanize }} times in 15 minutes."
            runbook: "https://github.com/sodiq-code/neurascale-ops/blob/main/runbooks/crash-loop.json"

        # ── KServe High Latency ───────────────────────────────────────────────
        - alert: KServeHighLatency
          expr: |
            histogram_quantile(0.99,
              sum(rate(revision_request_latencies_bucket{
                namespace="production"
              }[5m])) by (le, revision_name)
            ) > 2000
          for: 5m
          labels:
            severity: high
            team: platform
          annotations:
            summary: "KServe P99 latency >2s for {{ $labels.revision_name }}"
            description: "P99 inference latency is {{ $value | humanizeDuration }} — SLO threshold is 2s."

        # ── ArgoCD Out of Sync ────────────────────────────────────────────────
        - alert: ArgoCDApplicationOutOfSync
          expr: |
            argocd_app_info{sync_status="OutOfSync"} == 1
          for: 5m
          labels:
            severity: high
            team: platform
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is OutOfSync"
            description: "Application {{ $labels.name }} has been out of sync for >5 minutes. Git state diverged from cluster."
            runbook: "https://github.com/sodiq-code/neurascale-ops/blob/main/runbooks/argocd-out-of-sync.json"

    - name: neurascale.kyverno
      rules:
        - alert: KyvernoPolicyViolation
          expr: |
            sum by (policy, namespace, resource) (
              kyverno_policy_results_total{
                policy_result="fail",
                namespace=~"production|staging"
              }
            ) > 0
          for: 0m
          labels:
            severity: medium
            team: platform
          annotations:
            summary: "Kyverno policy violation: {{ $labels.policy }}"
            description: "Policy {{ $labels.policy }} blocked a resource in {{ $labels.namespace }}."
