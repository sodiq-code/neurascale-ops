apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: neuroscale-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-sync-failed.slack: incidents
    notifications.argoproj.io/subscribe.on-health-degraded.slack: incidents
spec:
  project: default
  source:
    repoURL: https://github.com/sodiq-code/neurascale-ops
    targetRevision: HEAD
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: false       # Never auto-prune — human approval required
      selfHeal: true     # Auto-revert manual cluster changes
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 10
