# Demo Scenario: CPU Throttling
# Deploys a deliberately under-resourced pod to trigger CPUThrottlingHigh alert
# Used to demonstrate the full NeuroScale Ops incident response pipeline

apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuroscale-stress-demo
  namespace: production
  labels:
    app: neuroscale-stress-demo
    neuroscale.io/environment: production
    neuroscale.io/demo: "true"
  annotations:
    neuroscale.io/demo-scenario: "cpu-throttling"
    neuroscale.io/description: "Intentionally low CPU limits to trigger throttling alert"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neuroscale-stress-demo
  template:
    metadata:
      labels:
        app: neuroscale-stress-demo
    spec:
      containers:
        - name: stress
          image: progrium/stress
          args:
            - "--cpu"
            - "2"          # Try to use 2 CPU cores
            - "--timeout"
            - "300s"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "100m"  # Way too low → triggers CPUThrottlingHigh
              memory: "64Mi"
---
